<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダイバーズ配列表共有アプリ</title>
  <!-- スワイプ並び替え用ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; padding: 16px; background: #f4f6f8; color: #333; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
    button { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; margin-top: 8px; }
    .btn-primary { background: #007aff; color: white; }
    .btn-danger { background: #ff3b30; color: white; }
    .btn-secondary { background: #8e8e93; color: white; }
    input, select { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .nav-tabs button { flex: 1; padding: 8px; background: #e5e5ea; color: #333; font-size: 14px; margin: 0; }
    .nav-tabs button.active { background: #007aff; color: white; }
    
    .card-item { border-bottom: 1px solid #ddd; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; background: #fff;}
    .card-item:last-child { border-bottom: none; }
    .rarity-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; color: #fff; min-width: 44px; text-align: center; margin-right: 10px; }
    .badge-SEC { background: #ff2d55; box-shadow: 0 0 4px #ff2d55; }
    .badge-UR { background: #ffcc00; color: #333; box-shadow: 0 0 4px #ffcc00; }
    .badge-SR { background: #a2a2bd; }
    .badge-R  { background: #5ac8fa; }
    .badge-N  { background: #8e8e93; }
    
    .card-info { flex: 1; display: flex; align-items: center; }
    .card-name { font-size: 14px; font-weight: bold; }
    .card-time { font-size: 11px; color: #999; margin-top: 4px; }
    
    .pattern-board { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 12px; }
    .pattern-column { flex: 0 0 280px; background: #f0f2f5; border-radius: 8px; padding: 12px; }
    .pattern-title { font-size: 14px; font-weight: bold; color: #444; margin-top: 0; margin-bottom: 12px; text-align: center; border-bottom: 2px solid #ccc; padding-bottom: 8px; }
    
    /* 並び替え時のハイライト */
    .sortable-ghost { opacity: 0.4; background: #eef2f5; }
    .drag-handle { color: #ccc; font-size: 18px; margin-right: 12px; cursor: grab; padding: 4px; }
  </style>
</head>
<body>

  <div class="nav-tabs">
    <button id="tabList" class="active" onclick="switchTab('list')">みんなの配列表</button>
    <button id="tabManage" onclick="switchTab('manage')">排出登録・管理</button>
  </div>

  <!-- 閲覧画面 -->
  <div id="listView" class="card" style="padding-right: 8px;">
    <h3 style="margin-top: 0; margin-bottom: 12px;">現在の排出順（上から下へ排出）</h3>
    <div id="arrayContainer" class="pattern-board">読み込み中...</div>
  </div>

  <!-- 管理画面 -->
  <div id="manageView" class="card" style="display: none;">
    <h3 id="formTitle" style="margin-top: 0;">排出したカードを登録</h3>
    
    <label>配列パターン</label>
    <input type="text" id="inputPattern" list="patternList" placeholder="例: A, 右シリンダー">
    <datalist id="patternList"></datalist>

    <label>レアリティ</label>
    <select id="inputRarity">
      <option value="N">N (ノーマル)</option>
      <option value="R">R (レア)</option>
      <option value="SR">SR (スーパーレア)</option>
      <option value="UR">UR (アルティメットレア)</option>
      <option value="SEC">SEC (シークレット)</option>
    </select>

    <label>カード番号 / 名前 (任意)</label>
    <input type="text" id="inputCard" placeholder="例: SD1-001 孫悟空">
    
    <div style="display: flex; gap: 8px;">
      <button id="submitBtn" class="btn-primary" onclick="saveCard()">配列に追加する</button>
      <button id="cancelEditBtn" class="btn-secondary" style="display: none; width: auto; flex: 0 0 100px;" onclick="cancelEdit()">取消</button>
    </div>

    <h3 style="margin-top: 32px; margin-bottom: 4px;">登録リスト (三本線を長押しで並び替え)</h3>
    <div id="manageContainer"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBez4K2ucO_UeizDN1QzMV7SAnz_trcJSE",
      authDomain: "divers-8ca59.firebaseapp.com",
      projectId: "divers-8ca59",
      storageBucket: "divers-8ca59.firebasestorage.app",
      messagingSenderId: "634964716377",
      appId: "1:634964716377:web:9075786cd1ab1495c07a48",
      measurementId: "G-14MHH2YPRR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const arrayCol = collection(db, 'divers_arrays');

    let cards = [];
    let editingId = null; // 編集中のIDを保持
    let sortableInstance = null;

    // 昇順（古いものが上・新しいものが下）で取得
    const q = query(arrayCol, orderBy('createdAt', 'asc'));
    onSnapshot(q, (snapshot) => {
      cards = [];
      snapshot.forEach((doc) => {
        cards.push({ id: doc.id, ...doc.data() });
      });
      window.renderArrays();
    });

    window.switchTab = function(tab) {
      document.getElementById('listView').style.display = tab === 'list' ? 'block' : 'none';
      document.getElementById('manageView').style.display = tab === 'manage' ? 'block' : 'none';
      document.getElementById('tabList').className = tab === 'list' ? 'active' : '';
      document.getElementById('tabManage').className = tab === 'manage' ? 'active' : '';
    };

    window.saveCard = async function() {
      const pattern = document.getElementById('inputPattern').value.trim() || '未分類';
      const rarity = document.getElementById('inputRarity').value;
      const cardName = document.getElementById('inputCard').value.trim() || '不明';
      
      if (editingId) {
        // 編集モード
        await updateDoc(doc(db, 'divers_arrays', editingId), {
          pattern: pattern,
          rarity: rarity,
          name: cardName
        });
        alert(`更新しました！`);
        window.cancelEdit();
      } else {
        // 新規追加
        await addDoc(arrayCol, {
          pattern: pattern,
          rarity: rarity,
          name: cardName,
          createdAt: Date.now()
        });
        document.getElementById('inputCard').value = '';
        alert(`[${pattern}] に登録しました！`);
      }
    };

    window.editCard = function(id) {
      const target = cards.find(c => c.id === id);
      if(!target) return;

      editingId = id;
      document.getElementById('inputPattern').value = target.pattern;
      document.getElementById('inputRarity').value = target.rarity;
      document.getElementById('inputCard').value = target.name;
      
      document.getElementById('formTitle').innerText = '登録内容を編集';
      document.getElementById('submitBtn').innerText = '更新する';
      document.getElementById('submitBtn').classList.replace('btn-primary', 'btn-danger');
      document.getElementById('cancelEditBtn').style.display = 'block';
      
      // 入力欄までスクロール
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.cancelEdit = function() {
      editingId = null;
      document.getElementById('inputPattern').value = '';
      document.getElementById('inputRarity').value = 'N';
      document.getElementById('inputCard').value = '';
      
      document.getElementById('formTitle').innerText = '排出したカードを登録';
      document.getElementById('submitBtn').innerText = '配列に追加する';
      document.getElementById('submitBtn').classList.replace('btn-danger', 'btn-primary');
      document.getElementById('cancelEditBtn').style.display = 'none';
    };

    window.deleteCard = async function(id) {
      if(confirm('このデータを削除しますか？')) {
        await deleteDoc(doc(db, 'divers_arrays', id));
        if(editingId === id) window.cancelEdit();
      }
    };

    window.renderArrays = function() {
      const listContainer = document.getElementById('arrayContainer');
      const manageContainer = document.getElementById('manageContainer');
      const datalist = document.getElementById('patternList');
      
      if (cards.length === 0) {
        listContainer.innerHTML = '<p style="color:#666;">まだデータがありません</p>';
        manageContainer.innerHTML = '';
        datalist.innerHTML = '';
        return;
      }

      // パターンごとにグループ分け
      const groupedCards = {};
      cards.forEach(card => {
        const p = card.pattern || '未分類';
        if (!groupedCards[p]) groupedCards[p] = [];
        groupedCards[p].push(card);
      });

      // サジェスト更新
      const uniquePatterns = Object.keys(groupedCards);
      datalist.innerHTML = uniquePatterns.map(p => `<option value="${p}">`).join('');

      // 閲覧画面の描画
      let boardHtml = '';
      uniquePatterns.forEach(patternName => {
        const patternCards = groupedCards[patternName];
        let columnHtml = `<div class="pattern-column"><h4 class="pattern-title">${patternName}</h4>`;
        
        columnHtml += patternCards.map((item, index) => `
          <div class="card-item">
            <div class="card-info">
              <span class="rarity-badge badge-${item.rarity}">${item.rarity}</span>
              <div>
                <div class="card-name">${item.name}</div>
                <div class="card-time">${index + 1}枚目</div>
              </div>
            </div>
          </div>
        `).join('');
        
        columnHtml += `</div>`;
        boardHtml += columnHtml;
      });
      listContainer.innerHTML = boardHtml;

      // 管理画面の描画
      manageContainer.innerHTML = cards.map(item => `
        <div class="card-item" data-id="${item.id}">
          <div class="drag-handle">≡</div>
          <div class="card-info">
            <span class="rarity-badge badge-${item.rarity}">${item.rarity}</span>
            <div>
              <span style="font-size: 11px; background: #eee; padding: 2px 6px; border-radius: 4px; font-weight: bold; color: #555;">${item.pattern || '未分類'}</span>
              <div class="card-name" style="margin-top: 4px;">${item.name}</div>
            </div>
          </div>
          <div style="display: flex; gap: 4px; flex-direction: column;">
            <button style="padding: 6px 12px; font-size: 12px; border-radius: 4px; background: #007aff; color: #fff;" onclick="editCard('${item.id}')">編集</button>
            <button style="padding: 6px 12px; font-size: 12px; border-radius: 4px; background: #ff3b30; color: #fff;" onclick="deleteCard('${item.id}')">削除</button>
          </div>
        </div>
      `).join('');

      // ドラッグ＆ドロップ並び替えの初期化
      if(sortableInstance) sortableInstance.destroy();
      sortableInstance = Sortable.create(manageContainer, {
        handle: '.drag-handle', // 三本線をつかんだ時だけ動く
        animation: 150,
        onEnd: async function (evt) {
          if (evt.oldIndex === evt.newIndex) return;
          
          const items = Array.from(manageContainer.children);
          const draggedId = items[evt.newIndex].getAttribute('data-id');
          
          let newTime;
          if (evt.newIndex === 0) {
            // 一番上に移動した場合
            const nextId = items[1].getAttribute('data-id');
            newTime = cards.find(c => c.id === nextId).createdAt - 1000;
          } else if (evt.newIndex === items.length - 1) {
            // 一番下に移動した場合
            const prevId = items[items.length - 2].getAttribute('data-id');
            newTime = cards.find(c => c.id === prevId).createdAt + 1000;
          } else {
            // 間に移動した場合（前後の時間の中央値をとる）
            const prevId = items[evt.newIndex - 1].getAttribute('data-id');
            const nextId = items[evt.newIndex + 1].getAttribute('data-id');
            const prevTime = cards.find(c => c.id === prevId).createdAt;
            const nextTime = cards.find(c => c.id === nextId).createdAt;
            newTime = (prevTime + nextTime) / 2;
          }

          // データベースの時間を更新して順番を入れ替える
          await updateDoc(doc(db, 'divers_arrays', draggedId), {
            createdAt: newTime
          });
        }
      });
    };
  </script>
</body>
</html>
